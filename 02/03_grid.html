    <!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8px Grid Dashboard</title>
    <style>
        /* Grund-Reset */
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: sans-serif;
            background-color: #f0f0f0;
            padding: 16px; /* 8px x 2 */
        }

        /* Das Grid-System */
        .grid-container {
            display: grid;
            /* Sidebar: 250px | Content: Rest */
            grid-template-columns: 250px 1fr;
            /* Header: auto | Main: min 400px | Footer: auto */
            grid-template-rows: auto minmax(400px, 1fr) auto;
            
            gap: 16px; /* 8px x 2 */
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Platzierung der Elemente */
        .header {
            grid-column: 1;
            grid-row: 1;
        }

        .footer {
            grid-column: -1;
            grid-row: 3;
        }

        .aside {
            grid-row: 2;
            grid-column: 1;
            margin:40px;
            padding:40px;

        }

        .main {
            grid-row: 2;
            grid-column: 2;
            margin:40px;
            padding:40px;
        }
    </style>
</head>
<body>

    <div class="grid-container">

        <div class="header">
            <header>
                <h2>Dashboard Header</h2>
                <p> Header</p>
            </header>
        </div>
        
        <div class ="aside">
            <aside>
                <h3>Navigation</h3>
                <p>Navigation</p>
            </aside>
        </div>

        <div class ="main">
            <main>
                <h1>Main Content</h1>
                <p>Hier landen die primären Dashboard-Widgets.</p>
                <p>Widget 1</p>
                <p>Widget 2</p>
            </main>
        </div>

        <div class ="footer">
            <footer>
                <p>Dashboard Footer</p>
            </footer>
        </div>
    </div>

</body>
</html>
